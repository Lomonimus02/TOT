<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

<body class="homepage">
    <!-- Полноэкранная египетская рамка -->

    <!-- Космический фон -->

    <!-- Логотип сайта -->
    <div class="site-logo">

    <!-- Основной контент -->
    <main class="main-content">
        <div class="container">
            <!-- Заголовок сайта -->
            <header class="site-header">
                <h1 class="site-title" data-edit-id="site-title">Пирамида ТОТА</h1>
                <p class="site-subtitle" data-edit-id="site-subtitle">Древние знания для современного мира</p>
            </header>

            <!-- Основные картуши -->
            <div class="cartouches-container">
                <!-- Левый картуш - Основное меню (заменено изображением) -->
                <div class="cartouche left-cartouche image-cartouche">
                    <div class="image-container main-menu-image">
                        <img src="images/uploads/ChatGPT Image 15 авг. 2025 г., 23_49_46.png"
                             alt="Основное меню - Пирамида Тота"
                             class="cartouche-image responsive-image"
                             loading="lazy">
                        <!-- Контейнер для будущих наложенных изображений -->
                        <div class="overlay-container" id="main-menu-overlays">
                            <!-- Вертикальная колонка наложенных изображений для основного меню -->
                            <div class="overlay-column">
                                <img src="images/uploads/button_01.png"
                                     alt="Меню пункт 1"
                                     class="overlay-image two-line-button"
                                     loading="lazy">
                                <img src="images/uploads/button_02.png"
                                     alt="Меню пункт 2"
                                     class="overlay-image"
                                     loading="lazy">
                                <img src="images/uploads/button_03.png"
                                     alt="Меню пункт 3"
                                     class="overlay-image"
                                     loading="lazy">
                                <img src="images/uploads/button_04.png"
                                     alt="Меню пункт 4"
                                     class="overlay-image two-line-button"
                                     loading="lazy">
                                <img src="images/uploads/button_05.png"
                                     alt="Меню пункт 5"
                                     class="overlay-image"
                                     loading="lazy">
                                <img src="images/uploads/button_06.png"
                                     alt="Меню пункт 6"
                                     class="overlay-image"
                                     loading="lazy">
                                <img src="images/uploads/button_07.png"
                                     alt="Меню пункт 7"
                                     class="overlay-image"
                                     loading="lazy">
                                <img src="images/uploads/button_08.png"
                                     alt="Меню пункт 8"
                                     class="overlay-image"
                                     loading="lazy">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Правый картуш - Обучение (заменено изображением) -->
                <div class="cartouche right-cartouche image-cartouche">
                    <div class="image-container education-image">
                        <img src="images/uploads/ChatGPT Image 16 авг. 2025 г., 00_06_27.png"
                             alt="Обучение - Школы и семинары"
                             class="cartouche-image responsive-image"
                             loading="lazy">
                        <!-- Контейнер для будущих наложенных изображений -->
                        <div class="overlay-container" id="education-overlays">
                            <!-- Вертикальная колонка наложенных изображений для обучения -->
                            <div class="overlay-column">
                                <img src="images/uploads/button_09.png"
                                     alt="Обучение пункт 1"
                                     class="overlay-image"
                                     loading="lazy">
                                <img src="images/uploads/button_10.png"
                                     alt="Обучение пункт 2"
                                     class="overlay-image"
                                     loading="lazy">
                                <img src="images/uploads/button_11.png"
                                     alt="Обучение пункт 3"
                                     class="overlay-image"
                                     loading="lazy">
                                <img src="images/uploads/button_12.png"
                                     alt="Обучение пункт 4"
                                     class="overlay-image two-line-button"
                                     loading="lazy">
                                <img src="images/uploads/button_13.png"
                                     alt="Обучение пункт 5"
                                     class="overlay-image"
                                     loading="lazy">
                                <img src="images/uploads/button_14.png"
                                     alt="Обучение пункт 6"
                                     class="overlay-image"
                                     loading="lazy">
                                <img src="images/uploads/button_15.png"
                                     alt="Обучение пункт 7"
                                     class="overlay-image"
                                     loading="lazy">
                                <img src="images/uploads/button_16.png"
                                     alt="Обучение пункт 8"
                                     class="overlay-image"
                                     loading="lazy">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Дополнительные блоки удалены -->
        </div>
    </main>

    <!-- Подвал сайта -->
    <footer class="site-footer">
        <div class="footer-content">
            <!-- Контакты -->
            <div class="footer-section">
                <h3>Контакты</h3>
                <div class="footer-contacts">
                    <div class="footer-contact-item">
                        <a href="tel:+78129050207">+7 (812) 905 02 07</a>
                    </div>
                    <div class="footer-contact-item">
                        <a href="mailto:info@piramidaspb.ru">info@piramidaspb.ru</a>
                    </div>
                </div>
            </div>

            <!-- Подписка на рассылку -->
            <div class="footer-section">
                <h3>Подписка на рассылку</h3>
                <form class="newsletter-form" id="newsletterForm">
                    <input type="email" class="newsletter-input" placeholder="Ваш email" required>
                    <button type="submit" class="newsletter-btn">Подписаться</button>
                </form>
            </div>

            <!-- Социальные сети -->
            <div class="footer-section">
                <h3>Мы в социальных сетях</h3>
                <div class="social-links">
                    <a href="https://vk.com/club187535764" class="social-link" target="_blank" title="ВКонтакте">
                        <img src="images/uploads/VK_Compact_Logo_(2021-present).svg.png" alt="ВКонтакте">
                    </a>
                    <a href="https://t.me/piramidatota" class="social-link" target="_blank" title="Телеграм">
                        <img src="images/uploads/Telegram_2019_Logo.svg.webp" alt="Телеграм">
                    </a>
                    <a href="https://rutube.ru/channel/42454841" class="social-link" target="_blank" title="РуТуб">
                        <img src="images/uploads/Rutube_icon.svg.png" alt="РуТуб">
                    </a>
                </div>
            </div>

            <!-- Копирайт -->
            <div class="footer-copyright">
                2019 - 2025г. Все права защищены, Isais ©
            </div>
        </div>
    </footer>

    <!-- Модальные окна -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Вход в систему</h2>

            <!-- Переключатель между входом и регистрацией -->
            <div class="auth-toggle">
                <button type="button" id="showLoginBtn" class="toggle-btn active">Вход</button>
                <button type="button" id="showRegisterBtn" class="toggle-btn">Регистрация</button>
            </div>

            <!-- Форма входа -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <input type="email" id="login-email" name="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="login-password" name="password" placeholder="Пароль" required>
                </div>
                <button type="submit" class="submit-btn">Войти</button>
            </form>

            <!-- Форма регистрации (скрыта по умолчанию) -->
            <form id="registerFormInModal" class="auth-form" style="display: none;">
                <div class="form-group">
                    <input type="text" id="register-name-modal" name="name" placeholder="Имя" required>
                </div>
                <div class="form-group">
                    <input type="email" id="register-email-modal" name="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="register-password-modal" name="password" placeholder="Пароль" required>
                </div>
                <div class="form-group">
                    <input type="password" id="register-confirm-modal" name="confirm-password" placeholder="Подтвердите пароль" required>
                </div>
                <button type="submit" class="submit-btn">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Регистрация</h2>
            <form id="registerForm">
                <div class="form-group">
                    <input type="text" id="register-name" name="name" placeholder="Имя" required>
                </div>
                <div class="form-group">
                    <input type="email" id="register-email" name="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="register-password" name="password" placeholder="Пароль" required>
                </div>
                <div class="form-group">
                    <input type="password" id="register-confirm" name="confirm-password" placeholder="Подтвердите пароль" required>
                </div>
                <button type="submit" class="submit-btn">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <!-- Подключение скриптов -->
    <script src="js/frame-manager.js"></script>
    <script src="js/session.js"></script>
    <script src="js/forms.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/main.js"></script>
    <script src="js/mobile.js"></script>
    <script src="js/modal-auth.js"></script>
    <script src="js/edit-mode.js"></script>
    <script src="js/newsletter.js"></script>
</body>
</html>
