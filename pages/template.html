<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PAGE_TITLE}} - Пирамида ТОТА</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/frame.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Полноэкранная египетская рамка -->
    <div class="fullscreen-frame"></div>

    <!-- Космический фон -->
    <div class="cosmic-background"></div>

    <!-- Логотип сайта -->
    <div class="site-logo">
        <a href="../index.html" title="Вернуться на главную страницу">
            <img src="../images/uploads/logo.png" alt="Пирамида ТОТА - Логотип">
        </a>
    </div>


    <!-- Основной контент -->
    <main class="main-content">
        <div class="container">
            <!-- Заголовок страницы -->
            <header class="page-header">
                <h1 class="page-title">{{PAGE_TITLE}}</h1>
                <p class="page-subtitle">{{PAGE_SUBTITLE}}</p>
            </header>

            <!-- Основной контент страницы -->
            <div class="page-content">
                <!-- Контент добавляется через inline редактор -->
            </div>

            <!-- Навигация по страницам -->
            <nav class="page-navigation">
                <a href="{{PREV_PAGE}}" class="nav-btn prev">← {{PREV_TITLE}}</a>
                <a href="{{NEXT_PAGE}}" class="nav-btn next">{{NEXT_TITLE}} →</a>
            </nav>
        </div>
    </main>    <!-- Подвал сайта -->
    <footer class="site-footer">
        <div class="footer-content">
            <!-- Контакты -->
            <div class="footer-section">
                <h3>Контакты</h3>
                <div class="footer-contacts">
                    <div class="footer-contact-item">
                        <a href="tel:+78129050207">+7 (812) 905 02 07</a>
                    </div>
                    <div class="footer-contact-item">
                        <a href="mailto:info@piramidaspb.ru">info@piramidaspb.ru</a>
                    </div>
                </div>
            </div>

            <!-- Подписка на рассылку -->
            <div class="footer-section">
                <h3>Подписка на рассылку</h3>
                <form class="newsletter-form" id="newsletterForm">
                    <input type="email" class="newsletter-input" placeholder="Ваш email" required>
                    <button type="submit" class="newsletter-btn">Подписаться</button>
                </form>
            </div>

            <!-- Социальные сети -->
            <div class="footer-section">
                <h3>Мы в социальных сетях</h3>
                <div class="social-links">
                    <a href="https://vk.com/club187535764" class="social-link" target="_blank" title="ВКонтакте">
                        <img src="../images/uploads/VK_Compact_Logo_(2021-present).svg.png" alt="ВКонтакте">
                    </a>
                    <a href="https://t.me/piramidatota" class="social-link" target="_blank" title="Телеграм">
                        <img src="../images/uploads/Telegram_2019_Logo.svg.webp" alt="Телеграм">
                    </a>
                    <a href="https://rutube.ru/channel/42454841" class="social-link" target="_blank" title="РуТуб">
                        <img src="../images/uploads/Rutube_icon.svg.png" alt="РуТуб">
                    </a>
                </div>
            </div>

            <!-- Копирайт -->
            <div class="footer-copyright">
                2019 - 2025г. Все права защищены, Isais ©
            </div>
        </div>
    </footer>

    <!-- Модальные окна -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Вход в систему</h2>
            <form id="loginForm">
                <div class="form-group">
                    <input type="email" id="login-email" name="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="login-password" name="password" placeholder="Пароль" required>
                </div>
                <button type="submit" class="submit-btn">Войти</button>
            </form>
        </div>
    </div>

    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Регистрация</h2>
            <form id="registerForm">
                <div class="form-group">
                    <input type="text" id="register-name" name="name" placeholder="Имя" required>
                </div>
                <div class="form-group">
                    <input type="email" id="register-email" name="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="register-password" name="password" placeholder="Пароль" required>
                </div>
                <div class="form-group">
                    <input type="password" id="register-confirm" name="confirm-password" placeholder="Подтвердите пароль" required>
                </div>
                <button type="submit" class="submit-btn">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <!-- Подключение скриптов -->
    <script src="../js/frame-manager.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/forms.js"></script>
    <script src="../js/animations.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/modal-auth.js"></script>
    <script src="../js/mobile.js"></script>
    <script src="../js/edit-mode.js"></script>
    <script src="../js/new-blocks-system.js"></script>
    <script src="js/newsletter.js"></script>


</body>
</html>
